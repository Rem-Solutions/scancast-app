name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:        # permite ejecutarlo a mano desde la pestaña Actions

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;34.0.0 platform-tools'

      # Instala Gradle 8.5 y guarda en caché las dependencias entre ejecuciones
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Build APK (con reintentos)
        run: |
          for attempt in 1 2 3; do
            gradle assembleDebug --no-daemon && exit 0
            echo "Intento $attempt falló, reintentando en 45 s..."
            sleep 45
          done
          exit 1

      - name: Upload generated APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
